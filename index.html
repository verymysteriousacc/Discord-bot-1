<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discord Messenger</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0f1117;color:#fff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.container{width:100%;max-width:500px;background:#181b24;border:1px solid #292d38;border-radius:14px;padding:22px}
h1{margin:0 0 18px;font-size:22px}
textarea{width:100%;height:130px;resize:none;background:#0f1117;color:#fff;border:1px solid #303542;border-radius:10px;padding:14px;font-size:15px;outline:none}
textarea:focus{border-color:#5865f2}
button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:#5865f2;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
#status{margin-top:12px;font-size:14px;min-height:20px;color:#aaa}
</style>
</head>
<body>
<div class="container">
<h1>Discord Messenger</h1>
<textarea id="message" placeholder="Type your message..."></textarea>
<button id="send">Send Message</button>
<div id="status"></div>
</div>
<script>
const WORKER_URL="https://discord-bot-1.ihsanodabas29.workers.dev";
const message=document.getElementById("message");
const send=document.getElementById("send");
const status=document.getElementById("status");

send.onclick=async()=>{
const content=message.value.trim();

if(!content){
status.textContent="Enter a message first.";
return;
}

send.disabled=true;
status.textContent="Sending...";

try{
const response=await fetch(WORKER_URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({content})
});

const data=await response.json().catch(()=>({}));

if(!response.ok){
throw new Error(data.error||"Failed to send message");
}

status.textContent="Message sent.";
message.value="";
}catch(error){
status.textContent=error.message||"Failed to send message.";
}finally{
send.disabled=false;
}
};
</script>
</body>
</html>
